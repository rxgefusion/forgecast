plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

repositories {
	// Loom adds the Minecraft/Fabric repositories automatically.
	// Add extra repositories here only when depending on other people's mods.
	mavenCentral()
}

loom {
	runConfigs.client {
		// DevAuth Neo ships disabled on purpose so it can never activate by
		// accident. This turns it on for runClient only - a server has no
		// account to log in with.
		//
		// 'account' is just a local label for the saved token, not an email
		// address. Setting it here stops DevAuth pausing to ask for it on the
		// console, which Gradle's progress bar hides.
		vmArgs "-Ddevauth.enabled=1", "-Ddevauth.account=main"
	}
}

dependencies {
	// Versions live in gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API - technically optional, but you almost certainly want it.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Lets Minecraft load a mod written in Kotlin.
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"

	// Dev-only: lets the dev client sign in with a real Microsoft account.
	// 'localRuntime' means it is on the classpath when running locally but is
	// NEVER compiled into, or shipped with, the mod jar.
	localRuntime "net.litetex.mcm:dev-auth-neo:${project.dev_auth_neo_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	// Substitutes ${version} inside fabric.mod.json with the version above.
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

kotlin {
	jvmToolchain(25)
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
